# Netlify builds and hosts the React site in client/.
# Forms (contact, demo, newsletter) use Netlify Forms; see client/src/lib/api.ts.
# The Express API in server/ is only used for local development.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"          # relative to base, i.e. client/dist

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let React Router handle every page URL (/solutions/gst, /pricing, etc.).
# Netlify still serves real files (assets, images, sitemap) first, and form POSTs are
# handled by Netlify Forms before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built JS/CSS have a content hash in their names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand images change rarely: cache for a week.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pages: always check for a new version, so a new deploy shows up at once.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
