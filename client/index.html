<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#072D59" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PairoApps" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PairoApps",
        "url": "https://www.pairoapps.com",
        "logo": "https://www.pairoapps.com/favicon.svg",
        "description": "AI-powered ERP software that connects finance, operations, people and processes in one platform."
      }
    </script>
  </head>
  <body>
    <!--
      Netlify Forms: Netlify reads these hidden forms at deploy time to learn each form's
      fields. The real forms are React components that post the same fields (src/lib/api.ts).
    -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="fullName" />
      <input name="email" />
      <input name="company" />
      <input name="phone" />
      <input name="industry" />
      <textarea name="requirements"></textarea>
      <input name="preferredContact" />
      <input name="intent" />
      <input name="source" />
      <input name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="email" />
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
